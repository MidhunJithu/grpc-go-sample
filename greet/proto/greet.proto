syntax = "proto3";

option go_package = "github.com/MidhunJithu/grpc-go-sample/greet/proto";

package greet;

message GreetRequest{
    string first_name = 1;
}
message GreetResponse{
    string result = 1;
}

service GreetService {
    rpc Greet(GreetRequest) returns (GreetResponse); // Unary
    rpc GreetMany(GreetRequest) returns (stream GreetResponse); // Server Streaming
    rpc LongGreets(stream GreetRequest) returns (GreetResponse); // Client Streaming
    rpc GreetEveryone(stream GreetRequest) returns (stream GreetResponse); // Bi-directional Streaming
}